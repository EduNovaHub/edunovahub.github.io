<!DOCTYPE html>
<html>
<head>
<title>Maths Notes</title>

<style>
.chapter-container{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:25px;
margin-top:40px;
}

.chapter-card{
background:white;
padding:30px;
border-radius:20px;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
transition:0.3s;
text-align:center;
}

.chapter-card:hover{
transform:translateY(-8px);
}

.chapter-card h2{
color:#2563eb;
margin-bottom:10px;
}

.chapter-card p{
color:#555;
margin-bottom:20px;
}

.chapter-card button{
background:#2563eb;
color:white;
border:none;
padding:12px 20px;
border-radius:10px;
cursor:pointer;
}
body{
font-family:Poppins,sans-serif;
background:#f5f7ff;
padding:40px;
}

h1{
color:#2563eb;
}

.chapter{
background:white;
padding:20px;
margin-top:20px;
border-radius:15px;
box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

</style>

</head>

<body>

<h1>📘 Class 8 Maths</h1>

<div class="chapter-container">

<div class="chapter-card">
<h2>Chapter 1</h2>
<p>Rational Numbers</p>
<button>Open Notes</button>
</div>

<div class="chapter-card">
<h2>Chapter 2</h2>
<p>Linear Equations</p>
<button>Open Notes</button>
</div>

<div class="chapter-card">
<h2>Chapter 3</h2>
<p>Understanding Quadrilaterals</p>
<button>Open Notes</button>
</div>

</div>

</body>
</html>
