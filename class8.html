<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Class 8</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#f5f7ff;
padding:40px;
}

.heading{
text-align:center;
margin-bottom:50px;
}

.heading h1{
font-size:50px;
color:#2563eb;
}

.heading p{
margin-top:10px;
font-size:18px;
color:#555;
}

.subject-container{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:30px;
margin-top:40px;
}

.subject-card{
background:white;
padding:40px 20px;
border-radius:20px;
text-align:center;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
transition:0.3s;
}

.subject-card:hover{
transform:translateY(-10px);
}

.subject-card h2{
margin:20px 0;
color:#2563eb;
}

.subject-card p{
color:#666;
margin-bottom:20px;
}

.subject-card a{
text-decoration:none;
background:#2563eb;
color:white;
padding:12px 25px;
border-radius:10px;
display:inline-block;
}

</style>

</head>

<body>

<div class="heading">

<h1>Class 8 Dashboard</h1>

<p>
Select your subject and start learning.
</p>

</div>

<div class="subject-container">

<div class="subject-card">
<h2>📘 Maths</h2>
<p>Chapter-wise maths notes and formulas.</p>
<a href="maths.html">Open</a>
</div>

<div class="subject-card">
<h2>🔬 Science</h2>
<p>Easy science notes and explanations.</p>
<a href="science.html">Open</a>
</div>

<div class="subject-card">
<h2>📖 English</h2>
<p>English chapters and grammar notes.</p>
<a href="english.html">Open</a>
</div>

<div class="subject-card">
<h2>🌍 SST</h2>
<p>History, Civics and Geography notes.</p>
<a href="sst.html">Open</a>
</div>

</div>

</body>
</html>
